name: Check Demos

on:
  push:
    branches:
      - main
    paths:
      - '**/README.md'
      - 'docs/demos/**'
  pull_request:
    paths:
      - '**/README.md'
      - 'docs/demos/**'

jobs:
  check-demos:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check demo media references
        run: make check-demos
